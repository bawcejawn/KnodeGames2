              return _ledger[0]
          def ymdh(t): return datetime.datetime.fromtimestamp(t / 1000, datetime.timezone.utc)
          def hour_round(t0): return ymdh(t0).strftime("%Y%m%d%H") + "0"
          def field_round(start): return ymdh(start).strftime("%Y%m%d") + "991"
          def hour_window(S0, S1): return {"W0": S0 - CARD_BLOCKS, "W1": S0 - 1, "L": S0 - 1, "S0": S0, "S1": S1}
          def field_window(last): return {"W0": last - CARD_BLOCKS + 1, "W1": last, "L": last, "S0": last + 1, "S1": last + FIELD_BLOCKS}
          def settings(rnd, w, paying): return dict(RULER_SET, round=rnd, window=w, paying=paying, pooled=list(RULER_SET["pooled"]))
          def field_of(card):
              ps = [p for p in card.get("producers", []) if type(p) is dict and p.get("entry") is True]
              ps.sort(key=lambda p: (-int(p["own"]), p["a"]))
              return [{"a": p["a"], "own": str(p["own"])} for p in ps[:23]]
          def rows_of(card, nodes):
              by = {p["a"]: p for p in card.get("producers", []) if type(p) is dict}
              out = {}
              for a in nodes:
                  p = by.get(a)
                  if p is not None: out[a] = {"fpct": None if p.get("fpct") is None else str(p["fpct"]), "entry": p.get("entry") is True, "void": p.get("void") is True, "credited": str(p["credited"]), "expected": str(p["expected"])}
              return out
          def check_card(f, what, e, rnd, w, paying):
              """A card is the one the ruler's data gives, byte for byte, from Last Node's own settings."""
              if type(e) is not dict or set(e) != {"round", "window", "card"} or e["round"] != rnd or e["window"] != w or type(e["card"]) is not str or len(e["card"]) > 1500000:
                  bad("%s: %s: its ruler card isn't for its round and window" % (f, what)); return None
              try: ok, diff = VR().recompute(ruler_ledger(), e["card"], settings(rnd, w, paying))
              except Exception as ex: bad("%s: %s: the ruler's card couldn't be checked (%s); tried again next run" % (f, what, str(ex)[:200])); return None
              if not ok: bad("%s: %s: the ruler's data doesn't give this card: %s" % (f, what, str(diff)[:200])); return None
              return json.loads(e["card"])

          # ── the rules (ports of lastnode-math.js cutsFrom and playerResult; the board as the recorder builds it) ──
          BONUS_STAYED, BONUS_JUMPED = 5, 3
          def ruler_cuts_from(field, hours):
              """Port of lastnode-math.js rulerCutsFrom."""
              standing, cuts = [x["a"] for x in field["nodes"]], []
              done = len(standing) <= 1
              for hr, hrow in enumerate(hours):
                  if done: break
                  rows, at, out, rest = (hrow.get("rows") or {}), hr + 1, [], []
                  for a in sorted(standing):
                      r = rows.get(a)
                      if r is not None and r.get("void") is True: out.append({"at": at, "a": a, "why": "void", "fpct": None})
                      elif r is None or r.get("entry") is not True or not dec(r.get("fpct")): out.append({"at": at, "a": a, "why": "no entry", "fpct": None})
                      else: rest.append((int(r["fpct"]), a))
                  rest.sort(key=lambda x: (-x[0], x[1]))
                  if len(rest) >= 2: w = rest.pop(); out.append({"at": at, "a": w[1], "why": "luck", "fpct": str(w[0])})
                  for c in out: cuts.append(c); standing.remove(c["a"])
                  done = len(standing) <= 1
              return {"cuts": cuts, "standing": standing, "done": done, "winner": standing[0] if done and len(standing) == 1 else None}
          def player_result(field, res, start, backup):
              names = [x["a"] for x in field["nodes"]]
              r = {"start": start, "jumpTo": None, "out": 0, "survived": 0, "rode": False, "jumped": False, "points": 0}
              if backup == start or backup not in names: backup = None
              node, standing, cs, k = start, set(names), res["cuts"], 0
              while k < len(cs):
                  e = k
                  while e + 1 < len(cs) and cs[e + 1]["at"] == cs[k]["at"]: e += 1
                  group = cs[k:e + 1]
                  for c in group: standing.discard(c["a"])
                  if not r["out"]:
                      hit = next((i for i, c in enumerate(group) if c["a"] == node), -1)
                      if hit < 0: r["survived"] += len(group)
                      elif not r["jumped"] and backup and backup in standing: r["jumped"] = True; r["jumpTo"] = backup; node = backup; r["survived"] += len(group) - 1
                      else: r["out"] = k + hit + 1
                  k = e + 1
              if res["done"] and not r["out"] and node == res["winner"]: r["rode"] = True; r["points"] = r["survived"] + (BONUS_JUMPED if r["jumped"] else BONUS_STAYED)
              else: r["points"] = r["survived"]
              return r
          def replay(j):
              """The cuts and players a day file's own field, hours and picks give (None for a void or field-less day)."""
              if "void" in j or not j["field"]: return None
              res = ruler_cuts_from(j["field"], j["hours"])
              names = {x["a"] for x in j["field"]["nodes"]}
              by = {}
              for row in j["picks"].get("0", []): by[row[0]] = (row[1], row[3] if len(row) == 4 else None)
              players = []
              for a, (s, b) in by.items():
                  if s not in names: continue
                  p = player_result(j["field"], res, s, b); p["a"] = a; players.append(p)
              players.sort(key=lambda p: (-p["points"], p["a"]))
              return res, players
          def strip_ranked(ps): return [{k: v for k, v in p.items() if k != "ranked"} for p in ps]
          def board_rows(days):
              """The recorder's view(): points, rides, fewer jumps, address; places shared by equal players; ranked if any row was."""
              by, rk = {}, set()
              for j in days:
                  if "void" in j: continue
                  for p in j["players"]:
                      b = by.setdefault(p["a"], {"a": p["a"], "pts": 0, "rides": 0, "jumps": 0, "events": 0})
                      b["pts"] += p["points"]; b["rides"] += 1 if p["rode"] else 0; b["jumps"] += 1 if p["jumped"] else 0; b["events"] += 1
                      if p["ranked"]: rk.add(p["a"])
              rows = sorted(by.values(), key=lambda b: (-b["pts"], -b["rides"], b["jumps"], b["a"]))
              place, out = 0, []
              for i, r in enumerate(rows):
                  q = rows[i - 1] if i else None
                  if not q or q["pts"] != r["pts"] or q["rides"] != r["rides"] or q["jumps"] != r["jumps"]: place = i + 1
                  out.append({"a": r["a"], "place": place, "pts": r["pts"], "rides": r["rides"], "jumps": r["jumps"], "events": r["events"], "ranked": r["a"] in rk})
              return out
          def vault_scores(ranked):
              """The recorder's vaultScores: the board's order and ties on 1–255."""
              rows = [r for r in ranked if r["pts"] >= 1]
              key = lambda r: (r["pts"], r["rides"], r["jumps"])
              groups = []
              for r in rows:
                  if not groups or groups[-1] != key(r): groups.append(key(r))
              keep = all(i == 0 or ((rows[i - 1]["pts"] == r["pts"]) == (key(rows[i - 1]) == key(r))) for i, r in enumerate(rows)) and all(r["pts"] <= 255 for r in rows)
              if keep: return [{"player": r["a"], "points": r["pts"]} for r in rows]
              rank = {g: max(1, min(255, len(groups)) - i) for i, g in enumerate(groups)}
              return [{"player": r["a"], "points": rank[key(r)]} for r in rows]

          # Fix-check LN3-1: the only voids the recorder writes, and when (bot/games/lastnode.ts: the field step and the
          # 3-day close). A new void is accepted only when the recorder itself would write it now.
          _fw = (os.environ.get("LASTNODE_FROM_WEEK") or "").strip()
          if _fw and not (_fw.isdigit() and int(_fw) >= 1): print("::error::LASTNODE_FROM_WEEK must be a vault week number"); sys.exit(1)
          FROM_WEEK = int(_fw) if _fw else None
          NEWVOIDS = []
          AT_LOCK = {"no ruler card for the field", "fewer than 2 nodes with entry on the ruler's field card"}
          ALLOUT = "every node still standing went out in the same hour"
          LATE = {"not recorded within 3 days", "never recorded"}
          # The fallback after the 48-hour grace (owner, 13 and 14 Nov 2026): the first hour with no ruler card, 48 hours after
          # it ended, makes the event void (bot/games/lastnode.ts NOCARD_48H). No one scores; nothing is returned.
          NOCARD_48H = "no ruler card for an hour within 48 hours"
          def check_new_void(f, j, old):
              why = j["void"]
              if why in AT_LOCK:
                  if j["field"] is not None or (old is not None and old.get("field")): bad("%s: void at the lock with a field" % f); return
                  if j["hours"] != [] or j["picks"] != {}: bad("%s: void at the lock with hours or picks" % f); return
                  if now < lock_of(round_of(j["start"])): bad("%s: made void before its picks locked" % f); return
                  # (Not cross-checked with vhp-data: the ruler's data can fall behind, so "no ruler card" may be honest even
                  # when the data has the block later; refusing it would stop every honest publish for good.)
                  # Fix-check LN3-3: a fresh cancel (published within 6 hours of the lock) turns the run red once.
                  if now < lock_of(round_of(j["start"])) + 6 * H: NEWVOIDS.append("%s newvoid" % f)
              elif why == ALLOUT:
                  # The VHP ruler: the event's own field and (checked) hours leave no node standing.
                  if not j["field"]: bad("%s: void for every node out, without a field" % f); return
                  rr = ruler_cuts_from(j["field"], j["hours"])
                  if not (rr["done"] and rr["winner"] is None): bad("%s: void for every node out, but its hours leave a node standing" % f)
              elif why == NOCARD_48H:
                  if not j["field"]: bad("%s: void for a missing hour card, without a field" % f); return
                  rr = ruler_cuts_from(j["field"], j["hours"])
                  if rr["done"]: bad("%s: void for a missing hour card, but its hours already decide it" % f); return
                  t1 = j["start"] + (len(j["hours"]) + 1) * H
                  if now < t1 + 48 * H: bad("%s: made void for a missing hour card before the 48-hour grace ended" % f); return
                  # Recorded and alerted: a fresh fallback void (within 6 hours of the grace's end) turns the run red once.
                  if now < t1 + 54 * H: NEWVOIDS.append("%s newvoid" % f)
              elif why in LATE:
                  if now - j["start"] <= 3 * DAY: bad("%s: made void while it can still be recorded" % f); return
                  if (why == "never recorded") != (j["field"] is None): bad("%s: void reason doesn't match its field" % f)
              else: bad("%s: a void reason the recorder never writes" % f)

          # ── day files: the rules, and what is already published ──
          inc, rinc = {}, {}
          for f in os.listdir(d):
              if f.startswith("D") and f.endswith(".json"): inc[f[1:-5]] = json.load(open(os.path.join(d, f), encoding="utf-8"))
              if f.startswith("R") and f.endswith(".json"): rinc[f[1:-5]] = json.load(open(os.path.join(d, f), encoding="utf-8"))
          # The ruler's cards (R<day>.json): only beside their day file, in their own shape; what was published never changes.
          def rday_ok(day, r):
              return type(r) is dict and set(r) == {"v", "day", "field", "hours"} and r["v"] == 1 and r["day"] == day and (r["field"] is None or type(r["field"]) is dict) and type(r["hours"]) is list and len(r["hours"]) <= 22
          for day, r in rinc.items():
              if day not in inc: bad("R%s.json: a ruler file without its day file" % day); continue
              if not rday_ok(day, r): bad("R%s.json: not the recorder's shape" % day); continue
              ro = show("lastnode/R%s.json" % day)
              if ro is not None and ((ro["field"] is not None and r["field"] != ro["field"]) or r["hours"][:len(ro["hours"])] != ro["hours"]): bad("R%s.json: a published ruler card changed" % day)
          def last_before(url, t, L):
              b = blocks(url, L, L + 1)
              return None if b[0][2] < t <= b[1][2] else "block %d isn't the last block before %d" % (L, t)
          def check_new_field(f, j, r):
              """The VHP ruler: a newly published field is its field card's (entry, the biggest 23 by own), and the card is the
              one the ruler's data gives from the last block before the field time (that block read on both nodes)."""
              fd, ft = j["field"], j["start"] - FIELD_LEAD
              if fd["at"] != ft or fd["round"] != field_round(j["start"]) or fd["window"] != field_window(fd["window"]["L"]): bad("%s: its field isn't at the field time, round and window" % f); return
              if len(RPCS) < 2 or RPCS[0] == RPCS[1]: bad("%s: the field card can't be checked on the chain (two nodes needed)" % f); return
              for u in RPCS:
                  try: why = last_before(u, ft, fd["window"]["L"])
                  except Exception as e: bad("%s: the field card's block couldn't be read on the chain (%s); tried again next run" % (f, str(e)[:200])); return
                  if why: bad("%s: the field card: %s (on %s)" % (f, why, u)); return
              if not r or r.get("field") is None: bad("%s: a new field without its ruler card (R file)" % f); return
              card = check_card(f, "the field", r["field"], fd["round"], fd["window"], False)
              if card is not None and field_of(card) != fd["nodes"]: bad("%s: its field's nodes aren't the ones its ruler card gives" % f)
          def check_new_hour(f, j, i, r):
              h, t0 = j["hours"][i], j["start"] + i * H
              check_edges(f, "hour %d" % i, t0, t0 + H, h["from"], h["to"])
              if not r or len(r.get("hours") or []) != len(j["hours"]): bad("%s: hour %d without its ruler card (R file)" % (f, i)); return
              card = check_card(f, "hour %d" % i, r["hours"][i], hour_round(t0), hour_window(h["from"], h["to"]), True)
              if card is not None and h["rows"] != rows_of(card, [x["a"] for x in j["field"]["nodes"]]): bad("%s: hour %d's rows aren't its ruler card's" % (f, i))
          merged = {}
          for day in published_days():
              j = show("lastnode/D%s.json" % day)
              if j is not None: merged[day] = j
          pub = dict(merged)
          for day, j in inc.items():
              f = "D%s.json" % day
              if j["week"] != weekOf(j["start"]): bad("%s: week %s isn't the week of its start" % (f, j["week"]))       # LNF-10
              for i in range(len(j["hours"])):
                  if j["start"] + (i + 1) * H > now + 120000: bad("%s: hour %d is recorded before it ended" % (f, i))
              old = pub.get(day)
              # The launch gate (LASTNODE_FROM_WEEK): no event of an earlier vault week is ever published.
              if FROM_WEEK is not None and j["week"] < FROM_WEEK: bad("%s: an event before the first live week (LASTNODE_FROM_WEEK = %d)" % (f, FROM_WEEK))
              # Fix-check LN3-1b: the recorder never writes a day past the next event (the UTC day's event + one day).
              if j["start"] > now // DAY * DAY + 14 * H + DAY: bad("%s: a day past the next event (more than a day ahead of the clock)" % f)
              # Fix-check LN3-1: a void is checked when it is first published, not only when it replaces a published day.
              if "void" in j and (old is None or "void" not in old): check_new_void(f, j, old)
              if old is not None and "void" in old: old_n, old_field, old_picks = len(old["hours"]), old.get("field"), True
              else: old_n, old_field, old_picks = (len(old["hours"]), old.get("field"), "0" in old["picks"]) if old is not None else (0, None, False)
              # Fix-check N-1: what this run adds is checked against the ruler's data and the chain (published parts can't change, below).
              if j["field"] and not old_field: check_new_field(f, j, rinc.get(day))
              if j["field"] and ("void" not in j or j["void"] in (ALLOUT, NOCARD_48H)):
                  for i in range(old_n, len(j["hours"])): check_new_hour(f, j, i, rinc.get(day))
                  if "0" in j["picks"] and not old_picks: check_picks_on_chain(f, j)
                  if j["hours"] and "0" not in j["picks"] and PICKS: bad("%s: hours without the event's picks" % f)
              rp = replay(j)
              if rp is not None:
                  res, players = rp
                  if [j["cuts"], j["standing"], j["winner"], j["done"]] != [res["cuts"], res["standing"], res["winner"], res["done"]]: bad("%s: the cuts don't follow from its field and hours" % f)
                  if strip_ranked(j["players"]) != players: bad("%s: the players don't follow from its picks and cuts" % f)          # LNF-23
              elif j["players"] or j["cuts"]: bad("%s: players or cuts without a field" % f)
              if old is not None:
                  if old.get("field") and j["field"] != old["field"]: bad("%s: the field changed after it was published" % f)        # LNF-2
                  if old["picks"] and j["picks"] != old["picks"]: bad("%s: the picks changed after they were published" % f)
                  if j["hours"][:len(old["hours"])] != old["hours"]: bad("%s: published hours changed" % f)
                  if "void" in old and j != old: bad("%s: a void event changed" % f)
                  if "void" in j and "void" not in old and j["void"] not in (ALLOUT, NOCARD_48H) and (old["done"] or now - j["start"] <= 3 * DAY): bad("%s: made void while it can still be recorded" % f)
                  if old["done"] and strip_ranked(j["players"]) != strip_ranked(old["players"]): bad("%s: a finished event's results changed" % f)
              merged[day] = j

          # ── last week's board and the vault file ──
          now_w = weekOf(now)
          lw_days = [j for j in merged.values() if j["week"] == now_w - 1 and j["start"] < now]
          want = board_rows(lw_days)
          def week_board(b):
              lw = b and b.get("lastWeek")
              return lw if type(lw) is dict and lw.get("week") == now_w - 1 else None
          inc_board = json.load(open(os.path.join(d, "board.json"), encoding="utf-8")) if os.path.isfile(os.path.join(d, "board.json")) else None
          pub_board = show("lastnode/board.json")
          ib, pb = week_board(inc_board), week_board(pub_board)
          # L-4: board.json shows last week's top 2,000 rows; the vault file is checked against the whole list (want).
          if ib and ib["rows"] != want[:2000]: bad("board.json: last week's rows don't add up from the day files")
          # Capacity (12 Nov): last week's rows past the 2,000 are in me/<char code>.json, exactly as the day files give.
          md = os.path.join(d, "me")
          if ib:
              tail, nr, nf = {}, 0, 0
              for i, r in enumerate(want):
                  if r["ranked"]: nr += 1
                  else: nf += 1
                  if i >= 2000: tail.setdefault(str(ord(r["a"][1])), []).append(dict(r, boardPlace=nr if r["ranked"] else nf))
              have = {f[:-5]: json.load(open(os.path.join(md, f), encoding="utf-8")) for f in (os.listdir(md) if os.path.isdir(md) else [])}
              for k in sorted(set(tail) | set(have)):
                  lwm = have.get(k, {}).get("lastWeek")
                  got = lwm["rows"] if lwm and lwm.get("week") == now_w - 1 else []
                  if got != tail.get(k, []): bad("me/%s.json: last week's rows past the board's 2,000 don't add up from the day files" % k)
          if pb and pb.get("final") and ib and (ib.get("final") is not True or ib["rows"] != pb["rows"]): bad("board.json: last week was final and has changed")
          # Fix-check N-3 (the recorder's coversWeek): last week is final only 12 hours after it ends and once every event of
          # it, from the game's first day on, is recorded and finished or void. A run that says "final" (or files a vault
          # file) any earlier is refused, so a half-recorded week can't be frozen.
          lw_start = WEEK0 + (now_w - 1) * WEEK
          first = min([j["start"] for j in merged.values()], default=None)
          want_days = [lw_start + 14 * H + k * DAY for k in range(7)]
          by_start = {j["start"]: j for j in merged.values()}
          complete = first is not None and now >= lw_start + WEEK + 12 * H and all(
              t < first or (t in by_start and (by_start[t].get("done") or "void" in by_start[t])) for t in want_days)
          vfiles = [f for f in (sorted(os.listdir(os.path.join(d, "vault"))) if os.path.isdir(os.path.join(d, "vault")) else []) if f == "W%d.json" % (now_w - 1)]
          if ((ib and ib.get("final") is True) or vfiles) and not complete: bad("board.json: last week is called final (or its vault file is filed) before every event of it is finished or void, or before 12 hours after it ended")
          final = bool((ib and ib.get("final")) or (pb and pb.get("final")))
          # ── the vault file's players, read again on the chain (fix-check N-1 "staked list"; Free play, owner 3 Nov) ──
          # Who is staked in game 13 for the week (get_game_player on the vault: `week_stake` is what earns; the most the wallet
          # had that week, `peak`, decides who can't win the free prize), and whether a free winner holds 1 VHP or has 1 VHP
          # staked in Knode Games (the VHP token's balance_of; the vault's get_player: stake + pending + stake_other).
          VAULT = os.environ.get("LASTNODE_VAULT") or ""
          VHP = os.environ.get("LASTNODE_VHP") or ""
          ONE_VHP = 100000000
          FREE_MIN_EVENTS, FREE_AMOUNTS = 3, (2, 1)
          def call_on(url, contract, entry, args):
              r = rpc(url, "chain.read_contract", {"contract_id": contract, "entry_point": entry, "args": base64.urlsafe_b64encode(args).decode().rstrip("=")})
              raw = r.get("result") or ""
              return pb_fields(base64.urlsafe_b64decode(raw + "=" * (-len(raw) % 4)))
          def pb_addr(field, a): b = b58_bytes(a); return pb_varint(field << 3 | 2) + pb_varint(len(b)) + b
          def first_of(fields, n, default=0):
              for f, v in fields:
                  if f == n: return v
              return default
          _state = {}
          def vault_min(url, week):
              """The vault's minimum stake for a week (get_state → config: min_stake 9, min_stake_next 13, min_stake_next_week 14),
              and whether v6 is live (v6_rule_week_plus_one, 21)."""
              if url not in _state:
                  cfg = pb_fields(first_of(call_on(url, VAULT, 1023583049, b""), 1, b""))
                  if not first_of(cfg, 1, b""): raise RuntimeError("no answer reading the vault's state on %s" % url)
                  _state[url] = cfg
              cfg = _state[url]
              nxt, frm = first_of(cfg, 13), first_of(cfg, 14)
              m = nxt if nxt > 0 and week >= frm else first_of(cfg, 9)
              return (first_of(cfg, 21) > 0), (m if m > 0 else ONE_VHP)
          _gp = {}
          def game_player(url, a, week):
              """(counted stake, peak) of wallet a in game 13 for a week, as Who Signs Block X reads it (vaultView)."""
              k = (url, a, week)
              if k not in _gp:
                  fs = call_on(url, VAULT, 267077419, pb_addr(1, a) + pb_varint(2 << 3) + pb_varint(13) + pb_varint(3 << 3) + pb_varint(week))
                  entry = first_of(fs, 2, None)
                  if entry is not None:
                      e = pb_fields(entry); peak = max(first_of(e, 7), first_of(e, 1))
                  else: peak = first_of(fs, 3)
                  _gp[k] = (first_of(fs, 4), peak)
              return _gp[k]
          def free_ok(url, a):
              """Holds at least 1 VHP, or has at least 1 VHP staked in Knode Games."""
              if first_of(call_on(url, VHP, 1550980247, pb_addr(1, a)), 1) >= ONE_VHP: return True
              p = pb_fields(first_of(call_on(url, VAULT, 936259717, pb_addr(1, a) + pb_varint(2 << 3) + pb_varint(0)), 1, b""))
              return first_of(p, 1) + first_of(p, 2) + first_of(p, 6) >= ONE_VHP
          def on_both(fn):
              """fn(url) on both nodes; they must agree (else RuntimeError: the vault file waits for the next run)."""
              if len(RPCS) < 2 or RPCS[0] == RPCS[1]: raise RuntimeError("two different nodes are needed (LASTNODE_RPC, LASTNODE_RPC_CHECK)")
              a, b = fn(RPCS[0]), fn(RPCS[1])
              if a != b: raise RuntimeError("the two nodes disagree")
              return a
          def free_prizes(rows, eligible):
              """Port of lastnode-math.js freePrizes: places among qualifying free players; ties split the places they cover."""
              q = [r for r in rows if r["pts"] >= 1 and r["events"] >= FREE_MIN_EVENTS and eligible(r["a"])]
              place, ranked = 0, []
              for i, r in enumerate(q):
                  p = q[i - 1] if i else None
                  if not p or (p["pts"], p["rides"], p["jumps"]) != (r["pts"], r["rides"], r["jumps"]): place = i + 1
                  ranked.append((r["a"], place))
              out, i = [], 0
              while i < len(ranked) and i < len(FREE_AMOUNTS):
                  j = i
                  while j + 1 < len(ranked) and ranked[j + 1][1] == ranked[i][1]: j += 1
                  for k in range(i, j + 1): out.append({"player": ranked[k][0], "place": ranked[k][1]})
                  i = j + 1
              return out
          def reached_of(days):
              """Port of the recorder's reachedOf (D-159's score time: the pick in the last event that gave the wallet points)."""
              out = {}
              for j in days:
                  if "void" in j: continue
                  t = {}
                  for x in j["picks"].get("0", []): t[x[0]] = max(t.get(x[0], 0), x[2])
                  for p in j["players"]:
                      if p["points"] > 0 and p["a"] in t: out[p["a"]] = max(out.get(p["a"], 0), t[p["a"]])
              return out
          def free_places(prizes, reached):
              """Port of the recorder's freePlaces (fix-check LN3-2, D-159): up to 10 a place; more than 10 tied pays exactly 10
              by earlier score time, then address; two or more tied for 1st leave 2nd empty."""
              def cap(who):
                  if len(who) <= 10: return who
                  return sorted(sorted(who, key=lambda a: (reached.get(a, 2 ** 53 - 1), a))[:10])
              first = sorted({x["player"] for x in prizes if x["place"] == 1})
              second = [] if len(first) >= 2 else sorted({x["player"] for x in prizes if x["place"] != 1})
              return cap(first), cap(second)
          def vault_expected(want, week):
              """What last week's vault file must hold: (rows, first, second), from the day files' board and the chain."""
              live, mn = on_both(lambda u: vault_min(u, week))
              if not live: raise RuntimeError("the vault isn't v6 on chain yet")
              scoring = [r for r in want if r["pts"] >= 1]
              gp = {r["a"]: on_both(lambda u, a=r["a"]: game_player(u, a, week)) for r in scoring}
              earning = {a for a, (ws, pk) in gp.items() if ws >= mn}
              rows = vault_scores([r for r in want if r["a"] in earning])
              free_rows = [r for r in want if r["a"] not in earning]
              ok = {}
              def eligible(a):
                  if a not in ok: ok[a] = gp[a][1] < mn and on_both(lambda u: free_ok(u, a))
                  return ok[a]
              # Read only as far as the places need (as the recorder): stop once 1st and 2nd are settled.
              cands = [r for r in free_rows if r["pts"] >= 1 and r["events"] >= FREE_MIN_EVENTS]
              key = lambda r: (r["pts"], r["rides"], r["jumps"])
              n = 0
              while True:
                  n += 25
                  read = cands[:n]
                  prizes = free_prizes(read, eligible)
                  nxt = cands[n] if n < len(cands) else None
                  last = next((r for r in read if prizes and r["a"] == prizes[-1]["player"]), None)
                  if nxt is None or (len(prizes) >= len(FREE_AMOUNTS) and last and key(nxt) != key(last)): break
              first, second = free_places(prizes, reached_of(lw_days))
              return rows, first, second, earning
          # ── watch-and-hold, as the recorder's watchWeek (fix-check N-9: the publish job enforces it too) ──
          import re
          REL = (os.environ.get("LASTNODE_RELEASE_WEEKS") or "").replace(" ", "")
          released = {int(x) for x in REL.split(",")} if re.fullmatch(r"\d{1,5}(,\d{1,5})*", REL) else set()
          if REL and not released: print("::warning::LASTNODE_RELEASE_WEEKS isn't a list of week numbers like 3,7; no week is released")   # I-7
          WEEK_Z, WEEK_WINS, EVENT_Z = 3.4, 2, 5
          def watch_week(days):
              by, chi, m = {}, 0, 0
              for j in sorted(days, key=lambda j: j["start"]):
                  if "void" in j or not j.get("field") or not j.get("done"): continue
                  # The VHP ruler: credited against expected blocks from each hour card, over the hours the node raced (up to and
                  # including the hour it went out), as watchWeek in bot/games/lastnode.ts.
                  out_at = {c["a"]: c["at"] for c in ruler_cuts_from(j["field"], j["hours"])["cuts"]}
                  for n in j["field"]["nodes"]:
                      s = by.setdefault(n["a"], {"got": 0, "exp": 0, "wins": 0, "events": 0, "chi": 0, "m": 0, "ev": []})
                      g, e = 0, 0
                      for i, h in enumerate(j["hours"]):
                          if i >= out_at.get(n["a"], 10 ** 9): break
                          r = h["rows"].get(n["a"])
                          if r and not r["void"]: g += int(r["credited"]) / 1e6; e += int(r["expected"]) / 1e6
                      if e > 0:
                          c = (g - e) * (g - e) / e; chi += c; m += 1; s["chi"] += c; s["m"] += 1
                      s["got"] += g; s["exp"] += e; s["events"] += 1
                      won = j["winner"] == n["a"]
                      if won: s["wins"] += 1
                      s["ev"].append((g, e, won))
              out = []
              for a, s in by.items():
                  if not s["exp"] > 0: continue
                  phi = max(1, (chi - s["chi"]) / (m - s["m"]) if m > s["m"] else 1)
                  z = (s["got"] - s["exp"]) / math.sqrt(phi * s["exp"])
                  one_day = any(won and e > 0 and (g - e) / math.sqrt(phi * e) >= EVENT_Z for g, e, won in s["ev"])
                  if (s["wins"] >= WEEK_WINS and z >= WEEK_Z) or one_day: out.append({"a": a, "q": js_round((s["got"] / s["exp"]) * 1000) / 1000, "wins": s["wins"], "events": s["events"]})
              return out
          lw = now_w - 1
          flags = watch_week(lw_days)
          lw_changed = any(day in pub and inc[day] != pub[day] or day not in pub for day, j in inc.items() if j["week"] == lw)
          pub_hold = show("lastnode/vault/HOLD-W%d.json" % lw) is not None
          lines = []
          vd = os.path.join(d, "vault")
          vnames = sorted(os.listdir(vd)) if os.path.isdir(vd) else []
          inc_hold = "HOLD-W%d.json" % lw in vnames
          for f in vnames:
              j = json.load(open(os.path.join(vd, f), encoding="utf-8"))
              if j["week"] != lw: continue                                                   # the shape check refuses these
              if f.startswith("HOLD-"):
                  # L-8: a hold file says exactly which nodes the rule flags; a week released by the owner needs none.
                  if lw in released or not flags or j["nodes"] != flags: lines.append("%s bad" % f); print("::error::vault/%s isn't what watch-and-hold gives for last week's day files" % f)
                  else: lines.append("%s ok" % f)
                  continue
              if not final: lines.append("%s hold" % f); continue
              # Two runs (fix-check N-1/N-3): a vault file is published only after last week's final board and day files are
              # already on games-data, unchanged by this run, so one bad run can't add hours and file the week together.
              if not (pb and pb.get("final")) or lw_changed: lines.append("%s hold" % f); continue
              # N-9: a week the rule flags, or one already held on games-data, isn't filed until the owner releases it.
              if lw not in released and (flags or pub_hold or inc_hold): lines.append("%s held" % f); continue
              # Fix-check N-1 / Free play (owner, 3 Nov): the rows (staked players' points), and 1st and 2nd of the Free play
              # board, must be exactly what last week's day files and the chain give. The stakes are read here, on both nodes.
              try: erows, efirst, esecond, earning = vault_expected(want, int(now_w - 1))
              except Exception as e:
                  lines.append("%s wait" % f); print("::warning::vault/%s couldn't be checked on the chain (%s); tried again next run" % (f, str(e)[:200])); continue
              # No rows while staked players scored: the recorder couldn't read the stakes (audit LN-2). Not published; it tries again.
              if not j["rows"] and erows: lines.append("%s empty" % f); continue
              if j["rows"] != erows: lines.append("%s bad" % f); print("::error::vault/%s: its rows aren't what last week's day files give, with the stakes read on chain" % f)
              elif [j["first"], j["second"]] != [efirst, esecond]: lines.append("%s bad" % f); print("::error::vault/%s: its free winners (first/second) aren't what last week's Free play board gives" % f)
              else: lines.append("%s ok" % f)
          # LNF-12: the Vault's 3 days end with no file while the week had scoring players: say so (the run fails at the end).
          ws = WEEK0 + now_w * WEEK
          if ws + 3 * DAY <= now < ws + 3 * DAY + 2 * H and any(r["pts"] >= 1 for r in want) and parent and show("lastnode/vault/W%d.json" % (now_w - 1)) is None and "W%d.json ok" % (now_w - 1) not in lines:   # L-6
              lines.append("W%d.json unfiled" % (now_w - 1))
          lines += NEWVOIDS
          open(status, "w", newline="\n").write("".join(x + "\n" for x in lines))
          for e in errs: print("::error::" + e)
          sys.exit(1 if errs else 0)
          HIST
          now_ms=${KG_TEST_NOW:-$(date +%s%3N)}
          git init -q work && cd work
          export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
          # Other games publish to the same branch: if a push loses the race, take the new branch tip and try again.
          for try in 1 2 3; do
            parent=""
            if git fetch -q --depth 1 "$remote" games-data 2>/dev/null; then
              parent=$(git rev-parse FETCH_HEAD)
              git read-tree FETCH_HEAD
            else git read-tree --empty; fi
            # The day list only ever grows: a run that lost track of earlier days is refused.
            if [ -n "$parent" ] && git cat-file -e "$parent:lastnode/index.json" 2>/dev/null; then
              git show "$parent:lastnode/index.json" > ../old-index.json
              /usr/bin/python3 -c 'import json,sys; o=set(json.load(open(sys.argv[1])).get("days") or []); n=set(json.load(open(sys.argv[2]))["days"]); missing=sorted(o-n); sys.exit("::error::Refusing to publish: days missing from index.json: %s" % missing[:10]) if missing else None' ../old-index.json "$IN/lastnode/index.json"
            fi
            if ! /usr/bin/python3 -I ../histcheck.py "$parent" "$IN/lastnode" "$now_ms" ../vault-status.txt; then echo "::error::Refusing to publish this run: its files break the rules or change published history."; exit 1; fi
            for f in "$IN"/lastnode/*.json; do
              blob=$(git hash-object -w "$f")
              git update-index --add --cacheinfo 100644 "$blob" "lastnode/$(basename "$f")"
            done
            for f in "$IN"/lastnode/me/*.json; do
              [ -e "$f" ] || continue
              blob=$(git hash-object -w "$f"); git update-index --add --cacheinfo 100644 "$blob" "lastnode/me/$(basename "$f")"
            done
            # A vault file is final: once published it is never replaced (the Vault posts it within the hour). Audit LN-1: a
            # different copy is an error you are told about (the run fails after publishing the rest).
            differs=""; vbad=""
            held=""; heldw=""
            # Watch-and-hold: the hold file only when histcheck.py's own watch-and-hold gives exactly it (fix-check L-8).
            for f in "$IN"/lastnode/vault/HOLD-W*.json; do
              [ -e "$f" ] || continue
              name="lastnode/vault/$(basename "$f")"
              st=$(grep -E "^$(basename "$f") " ../vault-status.txt | cut -d' ' -f2 || true)
              if [ "$st" != ok ]; then vbad="$vbad $name"; continue; fi
              # Told once, when the hold is first published (not on every run while it waits for your review).
              if [ -n "$parent" ] && git cat-file -e "$parent:$name" 2>/dev/null; then echo "::warning::$name is still waiting for your review."; continue; fi
              blob=$(git hash-object -w "$f"); git update-index --add --cacheinfo 100644 "$blob" "$name"; held="$held $(basename "$f")"
            done
            for f in "$IN"/lastnode/vault/W*.json; do
              [ -e "$f" ] || continue
              name="lastnode/vault/$(basename "$f")"
              if grep -qxF "$(basename "$f")" "$RUNNER_TEMP/vault-skip.txt"; then echo "::warning::$name arrived after the Vault's 3 days; not published."; continue; fi
              blob=$(git hash-object -w "$f")
              if [ -n "$parent" ] && old=$(git rev-parse -q --verify "$parent:$name" 2>/dev/null); then
                if [ "$old" != "$blob" ]; then differs="$differs $name"; fi
                continue
              fi
              # First publish of this week's file: histcheck.py compared it with last week's day files.
              st=$(grep -E "^$(basename "$f") " ../vault-status.txt | cut -d' ' -f2 || true)
              case "$st" in
                ok) git update-index --add --cacheinfo 100644 "$blob" "$name" ;;
                hold) echo "Holding $name until last week's final board is published and unchanged (next run)." ;;
                held) heldw="$heldw $name" ;;
                empty) echo "::warning::$name has no rows while last week has scoring players; not published (tried again next run)." ;;
                wait) echo "::warning::$name couldn't be checked on the chain this run; not published (tried again next run)." ;;
                *) vbad="$vbad $name" ;;
              esac
            done
            tree=$(git write-tree)
            if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."; nochange=1; break; fi
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "games: last node standing")
            if git push -q "$remote" "$commit:refs/heads/games-data"; then break; fi
            if [ "$try" = 3 ]; then echo "::error::Couldn't push games-data after 3 tries."; exit 1; fi
            sleep $((try * 5))
          done
          # Fix-check LNF-5 / L-7: what was left out is reported together, and the run fails once, at the end.
          fail=""
          if [ -n "$vbad" ]; then echo "::error::Not published: a vault or hold file doesn't match last week's day files:$vbad"; fail=1; fi
          if grep -q " unfiled$" ../vault-status.txt 2>/dev/null; then echo "::error::The Vault's 3 days for last week are over and no vault file was published (the week's bucket stays in the game). Check the recorder."; fail=1; fi
          # Fix-check LN3-3: an event cancelled at its lock (no ruler field card, too few nodes with entry), or by the 48-hour
          # fallback (owner, 13 and 14 Nov 2026), turns the run red once,
          # in the run that publishes it, so the owner is emailed. Its file is published; nothing is refused.
          nv=$(grep -E " newvoid$" ../vault-status.txt 2>/dev/null | cut -d' ' -f1 | tr '\n' ' ' || true)
          if [ -n "$nv" ]; then echo "::error::Last Node event(s) cancelled at the picks lock (no ruler field card, or fewer than 2 nodes with entry) or by the 48-hour fallback (no ruler card for an hour 48 hours after it): $nv. No one scores; nothing is returned. Check that the VHP ruler (vhp-data) is recording."; fail=1; fi
          if [ -n "${big:-}" ]; then echo "::error::Left out (over 2 MB): $big"; fail=1; fi
          if [ -n "${held:-}" ]; then echo "::error::Last week's vault file is HELD for your review:$held (see it on games-data). After reviewing, release it with: gh variable set LASTNODE_RELEASE_WEEKS --body \"<week>\""; fail=1; fi
          if [ -n "${heldw:-}" ]; then echo "::error::Not published: watch-and-hold flags last week (or it is held on games-data) and it isn't released:$heldw. After reviewing, release it with: gh variable set LASTNODE_RELEASE_WEEKS --body \"<week>\""; fail=1; fi
          if [ -n "$differs" ]; then echo "::error::Already published, and this run's copy is DIFFERENT (kept the published one; check it before the Vault seals):$differs"; fail=1; fi
          if [ -n "$fail" ]; then exit 1; fi
          [ -n "${nochange:-}" ] || echo "Last Node Standing files published."
