# The full old test suite (npm run test:audit). Manual only: Actions → Full test suite → Run workflow, and pick the
# pull request's branch. It must pass on a PR's current head before any bot, kit or payout PR merges (owner, 18 Nov).
# CI (ci.yml) runs the fast set on every pull request. This one takes 30–50 minutes, so it does not.
name: Full test suite

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: npm run test:audit
        env:
          TZ: UTC
          # Some tests make commits in scratch repositories; they need a name, not a real account.
          GIT_AUTHOR_NAME: test
          GIT_AUTHOR_EMAIL: test@example.invalid
          GIT_COMMITTER_NAME: test
          GIT_COMMITTER_EMAIL: test@example.invalid
        run: npm run test:audit
