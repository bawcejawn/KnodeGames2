# On every push and every pull request that touches the desk: build the contract, run its tests, and run the offline safety check.
name: Desk contract tests

on:
  push:
    paths: ["contracts/desk/**", "bot/chain.ts", "tools/protoc-pin.cjs", ".github/workflows/desk-test.yml"]
  pull_request:
    paths: ["contracts/desk/**", "bot/chain.ts", "tools/protoc-pin.cjs", ".github/workflows/desk-test.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/desk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Exactly the lockfile, with no package install scripts (a compromised package could otherwise run code here).
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The build tool's protoc plugins can stop with EAGAIN reading stdin: run them through the shim (Repo Lens #L-3 I-1).
      - run: node ../../tools/ci/use-protoc-shim.mjs .
      - name: npm test
        run: |
          set -o pipefail
          # protoc's plugin sometimes fails with EAGAIN while it is installing. That is not a test failure.
          for attempt in 1 2 3 4 5; do
            if npm test 2>&1 | tee test.log; then exit 0; fi
            if ! grep -q EAGAIN test.log || [ "$attempt" = 5 ]; then exit 1; fi
            echo "Build tool hit EAGAIN (attempt $attempt); retrying."
            sleep 5
          done
      - name: Show what failed (as annotations on the run page)
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "❌|\[Actual\]|\[Expected\]|ERROR|Error|error|Tests\]" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      # The upgraded code must read everything the live desk stored, exactly as it was written.
      - name: Upgrade compatibility with the live desk's data
        run: |
          set -o pipefail
          # The same EAGAIN retry as the vault's: the build tool's flake is not a test failure.
          for attempt in 1 2 3 4 5; do
            if npm run build:sim 2>&1 | tee build.log; then break; fi
            if ! grep -q EAGAIN build.log || [ "$attempt" = 5 ]; then exit 1; fi
            echo "Build tool hit EAGAIN (attempt $attempt); retrying."
            sleep 5
          done
          cd ../.. && npm ci --no-audit --no-fund --ignore-scripts
          # A skipped test means a build or fixture was not found: in CI that is a failure, not a pass.
          node --import tsx --test contracts/desk/scripts/storage-compat.test.ts 2>&1 | tee compat.log
          grep -q '^# skipped 0$' compat.log || { echo '::error::a storage-compat test was skipped'; exit 1; }
      - name: npm run check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      # A short summary on the run page (readable without opening the logs).
      - name: Summary
        if: always()
        run: |
          strip() { sed 's/\x1b\[[0-9;]*m//g' "$1" 2>/dev/null; }
          echo "::notice title=Tests::$(strip test.log | grep -E '\[(Groups|Result|Tests|Files)\]' | tr -s ' ' | tr '\n' ' ')"
          echo "::notice title=Offline check::$(strip check.log | grep -cE '^PASS') PASS, $(strip check.log | grep -cE '^FAIL') FAIL — $(strip check.log | grep -E 'contract size' | head -1)"
          strip check.log | grep -E '^FAIL' | while IFS= read -r l; do echo "::error title=Offline check::$l"; done
          sha=$(sha256sum build/release/contract.wasm 2>/dev/null | cut -d' ' -f1); echo "::notice title=Release build sha256::$sha"
